name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install project and development tools
        run: python -m pip install -e ".[dev]"

      - name: Check formatting and repository hygiene
        run: pre-commit run --all-files

      - name: Run verification and publish coverage baseline
        run: ./scripts/verify.sh
        env:
          PYTEST_ADDOPTS: --cov=jerico --cov-report=term-missing

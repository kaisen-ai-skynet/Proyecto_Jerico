repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.8
    hooks:
      - id: ruff-format
      - id: ruff
        args: [--fix]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
        exclude: ^(docs/informes/herdr-2026-09-29\.md|docs/spec/PLAN_CONEXION_VPS_ORACLE_EQUIPO\.md|docs/decisiones/.*|docs/SPEC_JERICO_V2\.md|docs/runbook-aprovisionamiento-vps\.md)$
      - id: check-yaml

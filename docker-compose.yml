services:
  jerico-core:
    build: .
    image: jerico-core:0.2.0
    container_name: jerico-core
    env_file: .env
    ports:
      - "8000:8000"
    volumes:
      - ./logs:/app/logs
    restart: unless-stopped
    networks:
      - jerico_net

networks:
  jerico_net:
    name: jerico_net

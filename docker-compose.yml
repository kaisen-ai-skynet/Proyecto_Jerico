services:
  jerico-core:
    build: .
    image: jerico-core:0.2.0
    container_name: jerico-core
    env_file: .env
    environment:
      JERICO_REDIS_URL: redis://redis:6379/0
      JERICO_STATE_DB_PATH: /app/data/jerico_state.db
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./logs:/app/logs
      - jerico_state_data:/app/data
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_started
    networks:
      - jerico_net

  redis:
    image: redis:7.4-alpine
    container_name: jerico-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - jerico_redis_data:/data
    restart: unless-stopped
    networks:
      - jerico_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  jerico-crm:
    build:
      context: .
      args:
        EXTRAS: crm
        CRM_TOOLS: "1"
    image: jerico-crm:0.2.0
    container_name: jerico-crm
    command: ["jerico-crm"]
    env_file: .env
    environment:
      JERICO_CRM_DATA_DIR: /app/crm-data
    volumes:
      - jerico_crm_data:/app/crm-data
    restart: unless-stopped
    mem_limit: 512m
    cpus: 0.5
    healthcheck:
      test: ["CMD", "python", "-c", "import os,sys,time; sys.exit(0 if time.time()-os.path.getmtime('/app/crm-data/heartbeat') < 120 else 1)"]
      interval: 60s
      timeout: 5s
      retries: 3
    networks:
      - jerico_net

networks:
  jerico_net:
    name: jerico_net

volumes:
  jerico_redis_data:
    name: jerico_redis_data
  jerico_state_data:
    name: jerico_state_data
  jerico_crm_data:
    name: jerico_crm_data
